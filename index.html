<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="no-referrer" />
    <title>OmniDiscover - Global Product Discovery & Affiliate Platform</title>
    <meta name="description" content="Discover, compare, and explore premium consumer technology, audio, laptops, cameras, and home gear across global merchants." />
    <meta property="og:title" content="OmniDiscover - Global Product Discovery & Affiliate Platform" />
    <meta property="og:description" content="Discover, compare, and explore premium consumer technology, audio, laptops, cameras, and home gear across global merchants." />
    <meta property="og:type" content="website" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <link rel="sitemap" type="application/xml" title="Sitemap" href="/sitemap.xml" />
    <link rel="canonical" href="https://omnidiscover.com/" />
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "OmniDiscover",
      "url": "https://omnidiscover.com/",
      "description": "Global Product Discovery, Hardware Specs Comparison & Affiliate Platform",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://omnidiscover.com/products?search={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  </head>
  <body class="bg-neutral-50 text-neutral-900 font-sans antialiased min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
